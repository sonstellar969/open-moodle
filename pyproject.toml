[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-moodle"
version = "0.1.0"
description = "Moodle client and Model Context Protocol (MCP) server for AI assistants and terminal use"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Lakshman Reddy", email = "lakshman.r3ddy@gmail.com" },
]
keywords = [
    "moodle",
    "mcp",
    "model-context-protocol",
    "education",
    "lms",
    "ai",
    "claude",
    "cursor",
    "antigravity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
open-moodle = "open_moodle.cli:main"

[project.urls]
Homepage = "https://github.com/sonstellar969/open-moodle"
Repository = "https://github.com/sonstellar969/open-moodle"
Issues = "https://github.com/sonstellar969/open-moodle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_moodle"]
